<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efede8">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <title>Install AppShare</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .inst { max-width: 460px; margin: 0 auto; padding: 28px 18px calc(28px + var(--safe-b)); }
    .inst .logo { width: 72px; height: 72px; border-radius: 20px; background: var(--brand); display: grid; place-items: center; margin: 8px auto 14px; box-shadow: 0 10px 26px rgba(196,71,26,.3); }
    .inst .logo svg { width: 44px; height: 44px; }
    .inst h1 { text-align: center; font-size: 1.6rem; }
    .inst .lead { text-align: center; color: var(--ink-2); margin-top: 6px; }
    .inst .card { margin-top: 22px; padding: 18px; }
    .inst .big { min-height: 56px; font-size: 1.05rem; }
    .inst .stepn { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; font-size: .8rem; font-weight: 700; margin-right: 8px; }
    .inst h2 { font-size: 1.05rem; display: flex; align-items: center; }
    .inst p.why { color: var(--ink-2); margin: 8px 0 14px; font-size: .94rem; }
    .inst .addr { display: flex; gap: 8px; margin-top: 12px; }
    .inst .addr input { flex: 1; min-width: 0; font-family: ui-monospace, monospace; font-size: .85rem; }
    .inst .tips { margin-top: 14px; font-size: .86rem; color: var(--ink-2); }
    .inst .tips b { color: var(--ink); }
    .inst .spin { width: 18px; height: 18px; border: 2.5px solid var(--line-2); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: -3px; margin-right: 8px; }
    .inst .foot { text-align: center; margin-top: 22px; font-size: .88rem; }
  </style>
</head>
<body>
  <main class="inst">
    <div class="logo" id="logo"></div>
    <h1>Install AppShare</h1>
    <p class="lead">Make, share and answer apps — it opens like any app on your phone, and shared links open in it.</p>
    <div id="step"></div>
    <p class="foot"><a href="/">Continue in the browser instead</a></p>
  </main>
  <script src="/static/common.js"></script>
  <script>
    // One page for every phone: works out where it was opened (camera quick view, an app's mini-browser, Chrome,
    // Samsung Internet, Safari…) and shows the single next step that works there.
    document.getElementById("logo").innerHTML = MARK;
    const ua = navigator.userAgent;
    const brands = (navigator.userAgentData?.brands || []).map(b => b.brand);
    const ios = /iPhone|iPad|iPod/.test(ua), android = /Android/.test(ua);
    const webview = /; wv\)/.test(ua) || brands.includes("Android WebView") || /FBAN|FBAV|Instagram|WhatsApp|Line\/|MicroMessenger|Snapchat|LinkedInApp|GSA\//.test(ua);
    const samsung = /SamsungBrowser/.test(ua), otherIOS = ios && /CriOS|FxiOS|EdgiOS/.test(ua);
    const realChrome = brands.includes("Google Chrome") && !webview;
    const here = location.origin + "/install";
    const $ = id => document.getElementById(id);
    let waited = 0, timer = null;

    const addressBox = () => `<div class="addr"><input class="input" id="addr" readonly value="${esc(location.origin)}"><button class="btn" id="cp">${ic("copy")}Copy</button></div>`;
    function bindCopy() {
      const b = $("cp"); if (!b) return;
      b.onclick = async () => { if (await copyText(location.origin)) toast("Address copied"); else { $("addr").focus(); $("addr").select(); } };
    }

    function render() {
      const step = $("step");
      if (isStandalone()) {
        step.innerHTML = `<div class="card">${ic("check")} <b>AppShare is installed.</b><p class="why">You're in the app now.</p><a class="btn primary block big" href="/">Open AppShare</a></div>`;
        return;
      }
      if (android && (webview || (!realChrome && !samsung && brands.length && !brands.includes("Google Chrome")))) {
        // The camera / a scanner / a chat app opened this in its own viewer — those can't install. Jump to Chrome.
        step.innerHTML = `<div class="card"><h2><span class="stepn">1</span>Open in Chrome</h2>
          <p class="why">Your camera or scanner opened this in its own quick viewer, which can't install apps. Chrome can.</p>
          <a class="btn primary block big" href="${esc(chromeIntent(here))}">${ic("globe")}Open in Chrome</a>
          <div class="tips">Nothing happened? Tap the <b>⋮</b> menu at the top of this screen → <b>Open in Chrome</b> (or <b>Open in browser</b>).
            Or open the <b>Chrome</b> app and go to this address:</div>${addressBox()}</div>`;
        bindCopy();
        return;
      }
      if (ios) {
        step.innerHTML = otherIOS
          ? `<div class="card"><h2><span class="stepn">1</span>Open in Safari</h2><p class="why">On iPhone, only Safari can add apps to the home screen. Copy the address and open it in Safari.</p>${addressBox()}</div>`
          : `<div class="card"><h2><span class="stepn">1</span>Add to Home Screen</h2><ol class="steps-list"><li>Tap <b>Share</b> (the square with an arrow) at the bottom.</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol></div>`;
        bindCopy();
        return;
      }
      if (installPrompt) {
        step.innerHTML = `<div class="card"><h2><span class="stepn">1</span>Tap Install</h2><p class="why">Chrome is ready to install AppShare.</p>
          <button class="btn primary block big" id="go">${ic("download")}Install AppShare</button></div>`;
        $("go").onclick = async () => {
          const p = installPrompt;
          try { p.prompt(); const c = await p.userChoice; installPrompt = null; if (c.outcome !== "accepted") render(); }
          catch { installPrompt = null; render(); }
        };
        return;
      }
      if (samsung) {
        step.innerHTML = `<div class="card"><h2><span class="stepn">1</span>Add to Home screen</h2><ol class="steps-list"><li>Tap the <b>≡</b> menu at the bottom.</li><li>Tap <b>Add page to</b> → <b>Home screen</b>.</li></ol></div>`;
        return;
      }
      // Chrome hasn't offered yet: it decides after a few seconds on the page. Wait, then show the manual way.
      if (waited < 12) {
        step.innerHTML = `<div class="card"><h2><span class="spin"></span>Getting ready to install…</h2><p class="why">Chrome checks the app first. This takes a few seconds — tap anywhere on the page meanwhile.</p></div>`;
        clearTimeout(timer); timer = setTimeout(() => { waited += 3; render(); }, 3000);
        return;
      }
      step.innerHTML = `<div class="card"><h2><span class="stepn">1</span>Install from Chrome's menu</h2>
        <ol class="steps-list"><li>Tap Chrome's <b>⋮</b> menu (top right).</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>
        <div class="tips"><b>Vivo, Oppo, Realme, Xiaomi, OnePlus:</b> if nothing appears on the home screen, allow Chrome to create shortcuts:
          <b>Settings → Apps → Chrome → Permissions → Home screen shortcuts / Desktop shortcuts → Allow</b>, then try again.</div>
        <div class="tips">No Install or Add to Home screen in the menu? You may be in an <b>Incognito</b> tab — open a normal tab and go to:</div>${addressBox()}</div>`;
      bindCopy();
    }
    window.addEventListener("beforeinstallprompt", () => setTimeout(render, 50));
    window.addEventListener("appinstalled", () => { $("step").innerHTML = `<div class="card">${ic("check")} <b>Installed!</b><p class="why">Find <b>AppShare</b> on your home screen.</p><a class="btn primary block big" href="/">Open AppShare</a></div>`; });
    render();
  </script>
</body>
</html>
